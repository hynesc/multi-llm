providers:
  ollama:
    base_url: http://localhost:11434/v1
    base_url_env: OLLAMA_BASE_URL
    timeout_seconds: 120
    max_retries: 1

strategies:
  bon/llama3.1:
    n: 3
    candidates:
      - provider: ollama
        model: llama3.1:8b
        weight: 1
    judge:
      provider: ollama
      model: qwen2.5:14b
    sampling:
      temperature: 0.7
      top_p: 0.95

  bon-pool/general:
    n: 3
    candidates:
      - provider: ollama
        model: llama3.1:8b
        count: 1
      - provider: ollama
        model: qwen2.5:7b
        count: 1
      - provider: ollama
        model: mistral:7b
        count: 1
    judge:
      provider: ollama
      model: qwen2.5:14b
    sampling:
      temperature: 0.7
